name: Release

# Push a tag like v0.2.0 to build the macOS app and publish a GitHub Release
# with the DMG and zip to the public fpolliop/sinfonie-releases repo.
# RELEASES_TOKEN: a fine-grained PAT with Contents: read/write on that repo.
# Signed and notarized when the Apple secrets below exist; unsigned otherwise.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.MAC_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Import the Developer ID certificate with a well-tested action: electron-builder's own keychain
      # setup fails intermittently on GitHub's macOS runners ("security set-key-partition-list ... failed 1").
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MAC_CERT_P12 }}
          p12-password: ${{ secrets.MAC_CERT_PASSWORD }}
      # Create the release up front, as a DRAFT, for two reasons:
      #  - electron-builder's parallel asset uploads otherwise race to create it and fail with 422;
      #  - a draft is invisible to GitHub's /releases/latest redirect, which sinfonie.dev/download follows.
      # The build takes ~12 minutes, so publishing the release first would point every download link on the
      # site at assets that do not exist yet. The last step below undrafts it once the DMGs are uploaded.
      - name: Create the draft release in the releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" -R fpolliop/sinfonie-releases >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" -R fpolliop/sinfonie-releases --draft --title "Sinfonie ${GITHUB_REF_NAME#v}" --notes "See the changelog at https://sinfonie.dev" --target "$(gh api repos/fpolliop/sinfonie-releases/commits/HEAD -q .sha)"
      - name: Build and publish
        # Signing uses the identity imported above (electron-builder auto-discovers it in the keychain);
        # notarization needs APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$HAS_CERT" != "true" ]; then
            echo "No signing certificate secret; building unsigned."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm release
      # Only now is the release complete: undrafting it creates the tag, makes it /releases/latest, and
      # hands sinfonie.dev/download a DMG that is actually there. A failed build leaves a draft nobody sees.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" -R fpolliop/sinfonie-releases --draft=false --latest
