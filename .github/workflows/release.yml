name: Release

# Push a tag like v0.2.0 to build the macOS app and publish a GitHub Release
# with the DMG and zip to the public fpolliop/sinfonie-releases repo.
# RELEASES_TOKEN: a fine-grained PAT with Contents: read/write on that repo.
# Signed and notarized when the Apple secrets below exist; unsigned otherwise.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # electron-builder publishes straight to a non-draft release, and GitHub refuses those unless the
      # tag already exists in the target repo. Create it first (pointing at that repo's current head) so
      # the parallel asset uploads don't race to create the release and fail with 422.
      - name: Ensure the release exists in the releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          # electron-builder's parallel uploads race to create the release; creating it (and its tag) here first removes that.
          gh release view "${GITHUB_REF_NAME}" -R fpolliop/sinfonie-releases >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" -R fpolliop/sinfonie-releases --title "Sinfonie ${GITHUB_REF_NAME#v}" --notes "See the changelog at https://sinfonie.dev" --target "$(gh api repos/fpolliop/sinfonie-releases/commits/HEAD -q .sha)"
      - name: Build and publish
        # Signing + notarization switch on automatically once these secrets exist:
        #   MAC_CERT_P12 (base64 of the Developer ID Application .p12), MAC_CERT_PASSWORD,
        #   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "No signing certificate secret; building unsigned."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm release
