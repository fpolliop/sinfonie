name: Release

# Push a tag like v0.2.0 to build the macOS app and publish a GitHub Release
# with the DMG and zip to the public fpolliop/sinfonie-releases repo.
# RELEASES_TOKEN: a fine-grained PAT with Contents: read/write on that repo.
# Builds are unsigned until Apple signing secrets exist.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm release
