<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sinfonie</title>
<meta name="theme-color" content="#0b0d11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sinfonie">
<link rel="manifest" href="/m/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
  :root{--bg:#0b0d11;--panel:#12151b;--panel2:#1b2030;--border:#232a38;--text:#e8eaf0;--muted:#8f97a8;--dim:#5f6779;--accent:#7c9cff;--accent2:#5b7cff;--ok:#4ade80;--warn:#fbbf24;--danger:#f87171;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
  body{display:flex;flex-direction:column;height:100dvh}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:rgba(11,13,17,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);min-height:52px}
  header h1{font-size:16px;margin:0;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .sub{font-size:12px;color:var(--muted);display:block;font-weight:400}
  .icon{background:none;border:0;color:var(--text);font:inherit;padding:6px;border-radius:8px;display:inline-flex;align-items:center}
  .icon:active{background:var(--panel2)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.busy{background:var(--accent);animation:pulse 1.2s infinite}
  .dot.need{background:var(--warn)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .hidden{display:none!important}
  .pad{padding:14px}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:10px}
  .btn.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));border-color:transparent;color:#fff}
  .btn.ok{background:rgba(74,222,128,.15);border-color:rgba(74,222,128,.4);color:var(--ok)}
  .btn.danger{background:rgba(248,113,113,.15);border-color:rgba(248,113,113,.4);color:var(--danger)}
  .btn.sm{padding:6px 10px;font-size:13px}
  .btn:disabled{opacity:.5}
  /* list */
  .ws{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);align-items:flex-start}
  .ws:active{background:var(--panel)}
  .ws .body{flex:1;min-width:0}
  .ws .name{font-weight:600;display:flex;align-items:center;gap:8px}
  .ws .name .sp{font-size:11px;color:var(--muted);font-weight:500}
  .ws .last{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .badge{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
  .badge.warn{color:var(--warn);border-color:rgba(251,191,36,.45)}
  .badge.acc{color:var(--accent);border-color:rgba(124,156,255,.45)}
  /* prompt cards */
  .card{margin:12px 14px;padding:12px;border:1px solid rgba(251,191,36,.45);background:rgba(251,191,36,.06);border-radius:12px}
  .card h3{margin:0 0 6px;font-size:14px;display:flex;gap:8px;align-items:center}
  .card pre{margin:6px 0;max-height:160px;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px;font:12px/1.4 var(--mono);white-space:pre-wrap;word-break:break-word}
  .card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .opt{display:block;width:100%;text-align:left;margin-top:6px}
  .opt small{display:block;color:var(--muted);font-weight:400}
  .opt.sel{border-color:var(--accent);background:rgba(124,156,255,.15)}
  /* chat */
  .msgs{padding:10px 12px 8px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:92%;font-size:15px}
  .msg.user{align-self:flex-end;background:rgba(91,124,255,.22);padding:8px 12px;border-radius:14px 14px 4px 14px;white-space:pre-wrap;word-break:break-word}
  .msg.assistant{align-self:flex-start;max-width:100%}
  .msg.system{align-self:center;color:var(--muted);font-size:12px}
  .md p{margin:0 0 8px}.md p:last-child{margin-bottom:0}
  .md pre{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 10px;overflow-x:auto;font:12.5px/1.45 var(--mono)}
  .md code{font:0.92em var(--mono);background:var(--panel2);padding:1px 4px;border-radius:4px}
  .md pre code{background:none;padding:0}
  .md ul,.md ol{padding-left:20px;margin:4px 0 8px}
  .md h1,.md h2,.md h3{font-size:15px;margin:10px 0 4px}
  .md table{border-collapse:collapse;font-size:13px;display:block;overflow-x:auto}.md td,.md th{border:1px solid var(--border);padding:3px 7px}
  .md a{color:var(--accent)}
  details.tool{margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--panel);font-size:13px}
  details.tool summary{padding:6px 10px;color:var(--muted);cursor:pointer;display:flex;gap:8px;align-items:center;list-style:none}
  details.tool summary::-webkit-details-marker{display:none}
  details.tool summary b{color:var(--text);font-weight:600}
  details.tool summary .hl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12px}
  details.tool pre{margin:0;padding:8px 10px;border-top:1px solid var(--border);font:12px/1.4 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto}
  details.tool .err{color:var(--danger)}
  .thinking{color:var(--dim);font-size:12px;font-style:italic}
  .typing{color:var(--muted);font-size:12px;padding:0 14px 6px}
  footer{position:sticky;bottom:0;display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:rgba(11,13,17,.9);backdrop-filter:blur(12px);border-top:1px solid var(--border)}
  footer textarea{flex:1;resize:none;max-height:120px;min-height:38px;border:1px solid var(--border);background:var(--panel);color:var(--text);font:inherit;font-size:15px;padding:8px 10px;border-radius:12px;outline:none}
  footer textarea:focus{border-color:var(--accent)}
  .banner{margin:12px 14px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--panel);font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .banner .btn{margin-left:auto}
  .empty{padding:40px 24px;text-align:center;color:var(--muted)}
  .empty h2{color:var(--text);font-size:18px;margin:0 0 6px}
</style>
</head>
<body>
<header>
  <button class="icon hidden" id="back" aria-label="Back">‹</button>
  <img src="/assets/icon-512.png" alt="" width="26" height="26" style="border-radius:7px" id="logo">
  <h1 id="title">Sinfonie</h1>
  <span class="dot" id="conn" title="Relay connection"></span>
  <button class="icon" id="stop" title="Stop the agent" style="display:none">■</button>
</header>
<main id="main">
  <div id="unpaired" class="empty hidden">
    <h2>Pair with your Mac</h2>
    <p>In Sinfonie on the Mac, open Settings → Phone and scan the QR code with this phone's camera.</p>
  </div>
  <div id="list" class="hidden">
    <div id="pushBanner" class="banner hidden"></div>
    <div id="listPrompts"></div>
    <div id="workspaces"></div>
  </div>
  <div id="chat" class="hidden">
    <div id="msgs" class="msgs"></div>
    <div id="typing" class="typing hidden">Working…</div>
    <div id="chatPrompts"></div>
  </div>
</main>
<footer id="composer" class="hidden">
  <textarea id="input" rows="1" placeholder="Message" autocapitalize="sentences"></textarea>
  <button class="btn primary" id="send">Send</button>
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.12/marked.min.js"></script>
<script src="/m/shared.js"></script>
<script src="/m/app.js"></script>
</body>
</html>
